# Projeto Supabase — região São Paulo (sa-east-1) por causa da LGPD
# (dado de menor fica no Brasil). Doc 6, seção 7.
project_id = "rumo-aprovacao"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
# Mesmo major do remoto: demo e produção estão em PostgreSQL 17.6
# (select version(), 25/09/2026). A stack local do E2E (Etapa 3) sobe
# com este valor.
major_version = 17

[db.seed]
# O E2E semeia com scripts/e2e/semear.mjs, depois da trava de destino
# (usuários pela API admin local, não por SQL em auth.users).
enabled = false

# ------------------------------------------------------------
# Serviços que o app não usa ficam desligados na stack local: menos
# imagem para baixar e menos tempo de subida no CI (Etapa 3).
# ------------------------------------------------------------
[studio]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

# Capturador de e-mail local (Mailpit): o e-mail de recuperação de
# senha do E2E cai aqui e nunca sai da máquina.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# só valem na stack local (E2E): o front é servido em 127.0.0.1:4173
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173/redefinir-senha"]
# login provisionado: ninguém se cadastra sozinho (aluno é menor;
# coordenação é provisionada pelo operador)
enable_signup = false

# ============================================================
# verify_jwt = false em TODAS as funções — B1 do catálogo de defeitos
# ------------------------------------------------------------
# NÃO é afrouxamento. O gate `verify_jwt` da PLATAFORMA roda antes do
# código da função e rejeita o preflight `OPTIONS` do navegador, que
# por especificação vai SEM cabeçalho `Authorization`. Resultado: o
# `if (req.method === "OPTIONS")` que todas as funções já têm nunca
# era alcançado, e o browser bloqueava gerar credencial, resetar
# senha, revogar credencial, troca obrigatória de senha e os dois
# botões de LGPD. A assinatura do problema era `virar-semana` ser a
# única com `false` e a única que funcionava.
#
# A autenticação REAL continua, no código de cada função, e é ela que
# sempre valeu (o gate de plataforma era redundante com ela):
#   gerar-meta, lgpd-titular, provisionar-aluno, trocar-senha
#       → chamador(req) → admin.auth.getUser(token) → 401
#         + papel !== "coordenacao" → 403
#   revogar-responsavel
#       → chamador(), e se null resolverSuperAdmin() (getUser +
#         internal_admins.ativo) → 401
#   backoffice-coordenador → superAdmin(req) → 403
#   virar-semana → comparação timing-safe da service role key → 403
#
# tests/onda1-cors-preflight.test.mjs trava as duas pontas: toda
# função responde OPTIONS antes de qualquer auth, e toda função tem
# entrada aqui com verify_jwt = false. Mexer numa sem a outra falha.
# ============================================================

[functions.gerar-meta]
verify_jwt = false

[functions.virar-semana]
# valida a chave de serviço no código (operador), não JWT de usuário
verify_jwt = false

[functions.provisionar-aluno]
verify_jwt = false

[functions.lgpd-titular]
verify_jwt = false

[functions.backoffice-coordenador]
# o código confirma super_admin ativo em internal_admins (superAdmin())
verify_jwt = false

# As duas abaixo NÃO existiam neste arquivo e por isso caíam no
# default da plataforma (true) — parte do mesmo defeito B1.
[functions.revogar-responsavel]
# coordenação (chamador) ou super_admin (resolverSuperAdmin), no código
verify_jwt = false

[functions.trocar-senha]
# exige sessão válida do próprio dono da senha (chamador → 401)
verify_jwt = false
