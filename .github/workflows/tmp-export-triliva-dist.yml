name: tmp-export-triliva-dist

on:
  push:
    branches:
      - tmp/triliva-pack-build-20260919

permissions:
  contents: read

jobs:
  build-export:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ac7c6429968ef6ebafea34d7c539ef772e67a8a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Create production-local demo env
        working-directory: app
        run: cp .env.production .env.production.local
      - name: Build production app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Package dist
        run: |
          tar -C app -czf /tmp/triliva-dist.tar.gz dist
          sha256sum /tmp/triliva-dist.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: triliva-dist-1ac7c64
          path: /tmp/triliva-dist.tar.gz
          if-no-files-found: error
          retention-days: 1
