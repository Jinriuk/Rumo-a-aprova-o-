name: tmp-export-triliva-dist

on:
  push:
    branches:
      - tmp/triliva-pack-build-20260919
    paths-ignore:
      - '_capture_dist.part*'
      - '_capture_dist.meta'

permissions:
  contents: write

jobs:
  build-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build production app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Export dist as base64 chunks
        run: |
          tar -C app -czf /tmp/triliva-dist.tar.gz dist
          sha256sum /tmp/triliva-dist.tar.gz | awk '{print $1}' > _capture_dist.meta
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> _capture_dist.meta
          printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> _capture_dist.meta
          base64 -w0 /tmp/triliva-dist.tar.gz | split -b 450000 - _capture_dist.part
      - name: Commit exported build to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _capture_dist.meta _capture_dist.part*
          git commit -m 'tmp: export production dist [skip ci]'
          git push origin HEAD:tmp/triliva-pack-build-20260919
