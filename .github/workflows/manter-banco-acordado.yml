# Mantém os projetos Supabase acordados — PRODUÇÃO e DEMO.
#
# A4 (Onda 8): até aqui só produção era coberta. A VITRINE ficava de
# fora, e ela é a peça de venda: o prospecto que abre o demo numa
# segunda-feira é justamente quem pagaria os segundos de despausar.
# O heartbeat diário da virada NÃO resolve isso — é pg_cron, trabalho
# interno do banco, e o contador de inatividade do Supabase só olha
# REQUISIÇÃO DE API (ver a nota logo abaixo).
#
# POR QUE ISTO EXISTE
# Projeto no plano free do Supabase é PAUSADO após 7 dias sem atividade de
# API, e acordar leva dezenas de segundos. Durante a prospecção o sistema
# passa dias sem ninguém entrar — então o primeiro prospecto a abrir o
# sistema na semana seria justamente quem pagaria a espera. Este workflow é
# o seguro contra isso, e custa ~10 segundos de runner por dia.
#
# POR QUE NÃO É pg_cron
# O contador de inatividade do Supabase olha REQUISIÇÃO DE API, não trabalho
# interno do banco. Um job rodando dentro do próprio Postgres não conta — a
# batida precisa vir de fora. Por isso Actions, e não a migration 0004.
#
# ⚠️ ATENÇÃO — ESTE SEGURO TEM UM PRAZO DE VALIDADE
# O GitHub DESATIVA automaticamente workflows agendados após 60 dias sem
# nenhuma atividade no repositório. Ou seja: se o projeto ficar dois meses
# parado, o seguro para de rodar exatamente quando ele seria mais necessário,
# e sem avisar. Se houver um período longo sem commits, entre no Actions e
# reative este workflow à mão (ou rode uma vez pelo "Run workflow").
#
# O QUE A BATIDA FAZ
# Um GET no endpoint REST com a chave anon. A tabela `concursos` tem GRANT de
# SELECT para `anon`, mas RLS ligada e NENHUMA policy para esse papel — então
# a resposta é 200 com lista vazia. É a batida mais barata possível que ainda
# conta como atividade real.
#
# ⚠️ A GARANTIA DE QUE A CONSULTA CHEGA AO POSTGRES VALE PARA 200, NÃO PARA
# QUALQUER 4xx. Com 200, a requisição atravessou o gateway, o PostgREST montou
# o plano, a policy de `anon` foi avaliada e nenhum dado saiu — é isso que
# conta como atividade de API. Com 401 ou 403 a requisição morre NO GATEWAY:
# a chave nem é aceita, nada chega ao banco, e não há garantia nenhuma de que
# a batida conte para o contador de inatividade do plano free. Por isso esses
# dois códigos são tratados como FALHA abaixo, e não como sucesso.
name: Manter banco acordado

on:
  schedule:
    # Diário. O plano previa a cada 3 dias; ficou diário de propósito, porque
    # o GitHub avisa que execuções agendadas podem ATRASAR em períodos de
    # carga alta. Com uma por dia sobram 7 chances dentro da janela de 7 dias;
    # a cada 3 dias sobrariam 2, e duas falhas seguidas já deixariam pausar.
    # Minuto quebrado de propósito: o topo da hora é o horário mais disputado
    # e o que mais sofre atraso.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Sem permissão nenhuma: este job não lê nem escreve nada do repositório.
permissions: {}

concurrency:
  group: manter-banco-acordado
  cancel-in-progress: false

jobs:
  bater:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bater no REST de produção
        env:
          # A chave anon é PUBLICÁVEL por design (ela já viaja no bundle para
          # todo visitante; a segurança é a RLS). Está como secret aqui só
          # para não aparecer no log — não porque o segredo importe.
          # Configure em Settings > Secrets and variables > Actions:
          #   PROD_SUPABASE_URL       ex.: https://SEU-REF.supabase.co
          #   PROD_SUPABASE_ANON_KEY  a chave anon do projeto de PRODUÇÃO
          URL: ${{ secrets.PROD_SUPABASE_URL }}
          ANON: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # Sem ambiente configurado, REPROVA. Até a Etapa 4 este caminho
          # saía com exit 0 e um ::warning::, e o workflow ficou verde por
          # dez execuções sem emitir um curl sequer (docs/e0-baseline.md,
          # Bloco 3): o aviso só aparecia dentro do log. Secret ausente é o
          # seguro desligado, e seguro desligado é falha, não pulo.
          if [ -z "${URL:-}" ] || [ -z "${ANON:-}" ]; then
            echo "::error::FALTA CONFIGURAÇÃO — sem PROD_SUPABASE_URL / PROD_SUPABASE_ANON_KEY. O projeto de produção NÃO está sendo mantido acordado, e pode pausar após 7 dias sem uso. Ver docs/operacao/manter-banco-acordado.md."
            exit 1
          fi

          alvo="${URL%/}/rest/v1/concursos?select=id&limit=1"

          # Três tentativas: uma falha de rede isolada não pode gastar a
          # batida do dia. Espera crescente entre elas.
          for tentativa in 1 2 3; do
            # A atribuição vem primeiro e o fallback DEPOIS, fora do $( ):
            # em falha de rede o próprio curl já imprime "000", então um
            # `|| echo 000` dentro da substituição concatenaria os dois.
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 30 \
              -H "apikey: ${ANON}" \
              -H "Authorization: Bearer ${ANON}" \
              "$alvo") || codigo="000"

            echo "tentativa ${tentativa}: HTTP ${codigo}"

            # A ORDEM DAS CLÁUSULAS AQUI É O CONSERTO. `case` casa o PRIMEIRO
            # padrão: sem a cláusula 401|403 vindo antes, um `401` cairia em
            # `4*` e o step imprimiria "Banco acordado — resposta 401" e
            # sairia com 0. Chave anon errada ou revogada passaria por boa,
            # todo dia, em verde.
            #
            # E o dano não é só relatório mentiroso: com 401/403 a requisição
            # é recusada NO GATEWAY e não chega ao Postgres, então não há
            # garantia de que conte como atividade de API. O seguro estaria
            # desligado exatamente enquanto se apresentava como ligado.
            #
            # Falha na PRIMEIRA ocorrência, sem gastar as três tentativas:
            # repetir não conserta chave, só atrasa o aviso em 30 segundos.
            #
            # Os demais 4xx continuam sendo sucesso, e isso está certo: um
            # 404 ou 400 prova que a chave foi aceita e o projeto processou
            # a requisição. Só 000 (sem resposta) e 5xx significam que a
            # batida não chegou.
            case "$codigo" in
              401|403)
                echo "::error::Chave anon INVÁLIDA ou revogada (HTTP ${codigo}). A batida foi recusada no gateway e NÃO chegou ao Postgres — não conta como atividade, e o projeto pode pausar após 7 dias mesmo com este workflow verde. Corrija o secret da chave anon deste ambiente (ver o nome dele no bloco env deste step)."
                exit 1
                ;;
              2*|4*)
                echo "Banco acordado — resposta ${codigo}."
                exit 0
                ;;
            esac

            [ "$tentativa" -lt 3 ] && sleep $((tentativa * 10))
          done

          echo "::error::A batida NÃO chegou ao projeto após 3 tentativas (última: HTTP ${codigo}). O projeto pode pausar se isso persistir por 7 dias."
          exit 1

      # `if: always()` NÃO é decoração. Sem ele, este step é PULADO sempre que
      # o step de produção sair com `exit 1` (a batida não chegou depois de 3
      # tentativas) — e o dia em que a produção não responde é justamente o dia
      # em que a vitrine mais precisa da batida dela. Os dois projetos são
      # independentes: um não pode ficar sem seguro porque o outro falhou.
      # Isto não mascara a falha de produção; o `exit 1` dela continua
      # reprovando o job.
      - name: Bater no REST do demo (vitrine)
        if: always()
        env:
          # A chave anon é PUBLICÁVEL por design (ela já viaja no bundle para
          # todo visitante; a segurança é a RLS). Está como secret aqui só
          # para não aparecer no log — não porque o segredo importe.
          # Configure em Settings > Secrets and variables > Actions:
          #   DEMO_SUPABASE_URL       ex.: https://SEU-REF.supabase.co
          #   DEMO_SUPABASE_ANON_KEY  a chave anon do projeto de DEMO (vitrine)
          URL: ${{ secrets.DEMO_SUPABASE_URL }}
          ANON: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # Sem ambiente configurado, REPROVA (mesma regra do passo de
          # produção, acima).
          if [ -z "${URL:-}" ] || [ -z "${ANON:-}" ]; then
            echo "::error::FALTA CONFIGURAÇÃO — sem DEMO_SUPABASE_URL / DEMO_SUPABASE_ANON_KEY. A VITRINE não está sendo mantida acordada, e pode pausar após 7 dias sem uso. Ver docs/operacao/manter-banco-acordado.md."
            exit 1
          fi

          alvo="${URL%/}/rest/v1/concursos?select=id&limit=1"

          # Três tentativas: uma falha de rede isolada não pode gastar a
          # batida do dia. Espera crescente entre elas.
          for tentativa in 1 2 3; do
            # A atribuição vem primeiro e o fallback DEPOIS, fora do $( ):
            # em falha de rede o próprio curl já imprime "000", então um
            # `|| echo 000` dentro da substituição concatenaria os dois.
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 30 \
              -H "apikey: ${ANON}" \
              -H "Authorization: Bearer ${ANON}" \
              "$alvo") || codigo="000"

            echo "tentativa ${tentativa}: HTTP ${codigo}"

            # A ORDEM DAS CLÁUSULAS AQUI É O CONSERTO. `case` casa o PRIMEIRO
            # padrão: sem a cláusula 401|403 vindo antes, um `401` cairia em
            # `4*` e o step imprimiria "Banco acordado — resposta 401" e
            # sairia com 0. Chave anon errada ou revogada passaria por boa,
            # todo dia, em verde.
            #
            # E o dano não é só relatório mentiroso: com 401/403 a requisição
            # é recusada NO GATEWAY e não chega ao Postgres, então não há
            # garantia de que conte como atividade de API. O seguro estaria
            # desligado exatamente enquanto se apresentava como ligado.
            #
            # Falha na PRIMEIRA ocorrência, sem gastar as três tentativas:
            # repetir não conserta chave, só atrasa o aviso em 30 segundos.
            #
            # Os demais 4xx continuam sendo sucesso, e isso está certo: um
            # 404 ou 400 prova que a chave foi aceita e o projeto processou
            # a requisição. Só 000 (sem resposta) e 5xx significam que a
            # batida não chegou.
            case "$codigo" in
              401|403)
                echo "::error::Chave anon INVÁLIDA ou revogada (HTTP ${codigo}). A batida foi recusada no gateway e NÃO chegou ao Postgres — não conta como atividade, e o projeto pode pausar após 7 dias mesmo com este workflow verde. Corrija o secret da chave anon deste ambiente (ver o nome dele no bloco env deste step)."
                exit 1
                ;;
              2*|4*)
                echo "Banco acordado — resposta ${codigo}."
                exit 0
                ;;
            esac

            [ "$tentativa" -lt 3 ] && sleep $((tentativa * 10))
          done

          echo "::error::A batida NÃO chegou ao projeto após 3 tentativas (última: HTTP ${codigo}). O projeto pode pausar se isso persistir por 7 dias."
          exit 1
