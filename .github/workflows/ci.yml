# CI — build + testes unitários (lógica pura + motor/RLS em Postgres real
# via Supabase CLI) e a suíte E2E Playwright numa stack Supabase LOCAL.
#
# SEGURANÇA: nenhum secret é necessário para o gate principal. O front
# usa só chaves PÚBLICAS (app/.env.production: URL + anon key, publicáveis
# por design — a segurança é a RLS). A service_role NUNCA entra aqui.
#
# HONESTIDADE DE STATUS (S1.1/S1.2, Etapa 5):
#   • `build-e-unitarios` — determinístico, sem dependência de rede
#     externa, roda as migrations + seeds 2x e a suíte `node --test`
#     (lógica pura + motor + RLS + suspensão) em Postgres 17.
#   • A E2E (job e2e-local, Etapa 3) sobe uma stack Supabase local e
#     descartável no próprio runner: não usa projeto hospedado nem
#     secret, NUNCA roda contra o demo ou a produção, e reprova em vez de
#     pular. Ver docs/operacao/e2e-ambiente.md.
#   • `matriz-autorizacao` — a matriz da camada banco num job próprio,
#     para ser exigida pelo nome.
#   • `release-gate` (Etapa 5) é o check que a proteção da main deve
#     exigir: roda sempre (if: always()), só passa com os três acima em
#     `success` e com o relatório de jornadas do e2e-local válido e do
#     mesmo commit. Nenhum job ou passo deste arquivo usa
#     continue-on-error (o gate confere). Ver docs/operacao/release-gate.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------
  # 1) BUILD + TESTES UNITÁRIOS — build de produção e a suíte inteira.
  #    Exigido pelo release-gate. Não depende de secret nenhum.
  # ------------------------------------------------------------
  build-e-unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres VANILLA de propósito: a migration 0001 cria as roles
    # (authenticated/anon/service_role) quando faltam, e a 0004 pula o
    # pg_cron quando indisponível — é o desenho do reset-db.sh.
    # Major 17, o mesmo do remoto (17.6) e da stack do E2E (Etapa 5;
    # até então era o 15).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rumo_teste
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tests/package-lock.json

      - name: Instalar dependências (app)
        working-directory: app
        run: npm ci

      # Onda 0 do plano de correção dos 86 defeitos (12/09/2026): o
      # repositório nunca teve linter. eslint.config.js trata a11y e
      # os achados do React Compiler (eslint-plugin-react-hooks v7)
      # como warn de propósito — não travam o gate ainda, ficam
      # visíveis para as ondas que os corrigem. O que trava aqui é
      # regressão real: import morto, hook fora de ordem, etc.
      - name: Lint (ESLint)
        working-directory: app
        run: npm run lint

      - name: Build de produção
        working-directory: app
        run: npm run build

      - name: Instalar dependências (tests)
        working-directory: tests
        run: npm ci

      - name: Migrations + seed (2x — idempotência exercitada)
        working-directory: tests
        run: bash reset-db.sh

      # Contrato front × banco. Roda LOGO DEPOIS do reset-db.sh, contra o
      # banco que as migrations do repo acabaram de produzir.
      #
      # POR QUE ESTE STEP EXISTE
      # Em 21/09/2026 a `abrir_proximo_ciclo` estava MORTA nos dois
      # ambientes: o front chamava por RPC (shared/data/index.js:368), a
      # tela existia, e a função não existia em schema nenhum. Nada no CI
      # pegava — o gate roda migrations num banco limpo, onde tudo existe.
      # O furo é entre o que o front CHAMA e o que o banco TEM.
      #
      # Aqui ele prova que o repositório é coerente consigo mesmo: se uma
      # migration for esquecida no PR que adiciona a chamada no front, ou
      # se um parâmetro for renomeado só de um lado, este step reprova.
      # Contra demo/produção é outra corrida, manual, antes de publicar —
      # ver docs/e1-migrations.md, Bloco 5.
      #
      # Não precisa de secret: fala com o Postgres de serviço deste job.
      - name: Contrato de RPCs (front × banco)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/rumo_teste
        run: node scripts/manifesto-rpcs.mjs

      - name: Testes unitários (regras + motor + isolamento RLS + suspensão)
        working-directory: tests
        run: npm test

      # Guarda anti-"verde vazio": se a suíte rodar 0 teste (ex.: seed
      # abortou e o passo anterior foi pulado), o CI tem que FALHAR.
      - name: Conferir que a suíte realmente rodou (mínimo de testes)
        working-directory: tests
        run: |
          N=$(node --test 2>/dev/null | sed -n 's/^# pass \([0-9]\+\)$/\1/p' | tail -1)
          echo "testes que passaram: ${N:-0}"
          if [ "${N:-0}" -lt 200 ]; then
            echo "::error::Suíte rodou ${N:-0} testes (< 200). Algo foi pulado silenciosamente."
            exit 1
          fi

  # ------------------------------------------------------------
  # E2E LOCAL (Etapa 3) — stack Supabase inteira no próprio runner
  # (Docker + CLI fixada), sem projeto hospedado e SEM SECRET NENHUM:
  # Postgres 17 como o remoto, Auth, PostgREST, Edge Functions e o
  # capturador de e-mail. Migrations + seeds + usuários pela API admin
  # local, front buildado com `--mode e2e` (não lê o .env.production do
  # demo). A trava (scripts/e2e/trava.mjs) recusa *.supabase.co e exige
  # host local, id de execução e marcador da fixture antes de escrever.
  #
  # Reprova, nunca pula:
  #   • configuração local errada (provas negativas, antes de tudo);
  #   • qualquer teste falho;
  #   • zero testes, jornada crítica abaixo do mínimo, teste crítico
  #     pulado ou instável, navegador falando com projeto hospedado
  #     (scripts/e2e/relatorio-jornadas.mjs, mínimos em jornadas.mjs).
  # Artefatos: só o que sai de scripts/e2e/sanitizar-artefatos.mjs (sem
  # trace, vídeo, relatório HTML nem estado de autenticação).
  # A stack é derrubada no fim mesmo em erro (passo com if: always()).
  # O relatório de jornadas sai como `outputs.relatorio` (SHA do
  # checkout + cada teste como arquivo:linha, tags e status; sem título,
  # que o runner pode tomar por segredo e descartar a saída) e o
  # release-gate o refaz.
  # ------------------------------------------------------------
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      relatorio: ${{ steps.relatorio.outputs.relatorio }}
    env:
      SUPABASE_CLI_VERSION: "2.118.0"
      # quem derruba a stack é o último passo (if: always()), não o trap
      E2E_MANTER_STACK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            tests/package-lock.json

      - name: CLI do Supabase (versão fixada)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Dependências (app e tests) e Chromium do Playwright
        run: |
          (cd app && npm ci)
          (cd tests && npm ci)
          (cd app && npx playwright install --with-deps chromium)

      - name: Provas negativas (configuração local errada tem de falhar)
        run: bash scripts/e2e/provas-negativas.sh

      - name: Stack local + banco + fixture + front + suíte inteira (jornadas e camada_http)
        run: bash scripts/e2e/rodar.sh

      - name: Artefatos sanitizados
        if: always()
        run: node scripts/e2e/sanitizar-artefatos.mjs e2e-artefatos

      - name: Publicar artefatos sanitizados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-local-${{ github.run_attempt }}
          path: e2e-artefatos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Derrubar a stack local (sempre, mesmo em erro)
        if: always()
        run: bash scripts/e2e/stack.sh parar

  # ------------------------------------------------------------
  # MATRIZ DE AUTORIZAÇÃO (Etapa 2, fatia 2; job próprio na Etapa 5)
  # A camada banco inteira (tests/e2-matriz-autorizacao-db.test.mjs,
  # 300+ casos sobre a fixture de cinco escolas, transação com rollback)
  # num job com nome, para o release-gate exigir a matriz e não só "a
  # suíte". Ela continua também dentro do `npm test` do
  # build-e-unitarios: tirar de lá abriria um buraco enquanto a proteção
  # da main ainda exige só aquele job. A camada HTTP da matriz é a
  # jornada `limites_acesso` do e2e-local.
  # Reprova se um teste do arquivo não passar, se algum for pulado ou
  # marcado como todo, ou se o arquivo encolher abaixo de 7 testes.
  # ------------------------------------------------------------
  matriz-autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rumo_teste
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências (tests)
        working-directory: tests
        run: npm ci

      - name: Migrations + seed
        working-directory: tests
        run: bash reset-db.sh

      - name: Matriz de autorização (camada banco), todo teste executado e aprovado
        working-directory: tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap e2-matriz-autorizacao-db.test.mjs | tee matriz.tap
          conta() { sed -n "s/^# $1 \([0-9]\+\)$/\1/p" matriz.tap | tail -1; }
          ESPERADO=$(grep -c '^test(' e2-matriz-autorizacao-db.test.mjs)
          echo "testes no arquivo: $ESPERADO; pass $(conta pass), fail $(conta fail), skipped $(conta skipped), todo $(conta todo), cancelled $(conta cancelled)"
          if [ "$ESPERADO" -lt 7 ] || [ "$(conta pass)" != "$ESPERADO" ] || [ "$(conta fail)" != 0 ] \
             || [ "$(conta skipped)" != 0 ] || [ "$(conta todo)" != 0 ] || [ "$(conta cancelled)" != 0 ]; then
            echo "::error::Matriz de autorização: nem todo teste do arquivo rodou e passou."
            exit 1
          fi

  # ------------------------------------------------------------
  # RELEASE GATE (Etapa 5) — o check que a proteção da main exige.
  # Roda SEMPRE (if: always()), inclusive quando um job acima falha, é
  # pulado ou cancelado, e reprova (scripts/ci/release-gate.mjs) quando:
  #   • build-e-unitarios, e2e-local ou matriz-autorizacao está ausente
  #     ou terminou em qualquer coisa que não seja success;
  #   • este arquivo usa continue-on-error ou perdeu um desses jobs;
  #   • o relatório de jornadas está ausente, é de outro SHA ou de outro
  #     run, tem zero testes, jornada crítica abaixo do mínimo ou teste
  #     crítico pulado, falho ou instável (avaliação refeita aqui).
  # Guarda estática: tests/ci-release-gate.test.mjs.
  # ------------------------------------------------------------
  release-gate:
    needs: [build-e-unitarios, e2e-local, matriz-autorizacao]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Jobs obrigatórios, ci.yml e relatório de jornadas
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/release-gate.mjs
